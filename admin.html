<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two-Rex RSVP Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main class="dash"><section id="login" class="card login"><h1>🦖 Host Dashboard</h1><p>Sign in with your Supabase host account.</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button><p id="loginError" class="error hidden"></p></form></section><section id="dashboard" class="hidden"><h1>🦖 Dhruv’s TWO-REX RSVP Dashboard</h1><section class="statgrid"><div class="stat"><b id="confirmed">0</b>Confirmed people</div><div class="stat"><b id="maybe">0</b>Maybe people</div><div class="stat"><b id="adults">0</b>Confirmed adults</div><div class="stat"><b id="kids">0</b>Confirmed kids</div></section><div class="toolbar"><button id="refresh">Refresh</button><button id="exportBtn">Export CSV</button><button id="signout">Sign out</button></div><section class="panel"><table><thead><tr><th>Name</th><th>RSVP</th><th>Adults</th><th>Kids</th><th>Contact</th><th>Note</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
