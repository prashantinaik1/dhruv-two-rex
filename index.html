<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhruv is TWO-REX!</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><section class="hero"><img class="invite" src="invite.png" alt="Dhruv is turning TWO-REX birthday invitation"><div class="card"><h1>RSVP 🦖</h1><p class="event">October 17, 2026 · 5:00 PM<br>3433 Riverside Station BLVD, Secaucus, NJ</p><form id="rsvp"><label>Your name<input name="family_name" required maxlength="100" placeholder="e.g. Priya & Rahul"></label><fieldset><legend>Will you be joining us?</legend><label class="choice"><input type="radio" name="rsvp_status" value="yes" required> Yes! We’ll be there 🎉</label><label class="choice"><input type="radio" name="rsvp_status" value="maybe"> Maybe — still figuring it out 🤔</label><label class="choice"><input type="radio" name="rsvp_status" value="no"> Sorry, we can’t make it</label></fieldset><div id="counts" class="row"><label>Adults<input type="number" name="adults" min="0" max="20" value="1"></label><label>Kids<input type="number" name="kids" min="0" max="20" value="0"></label></div><label>Email or phone<input name="contact" required maxlength="150" placeholder="name@email.com or phone number"></label><label>Note <span>(optional)</span><textarea name="note" maxlength="500" placeholder="Anything you’d like us to know"></textarea></label><button id="submitBtn" type="submit">Send RSVP</button><p id="error" class="error hidden"></p><p class="fine">Please RSVP by October 11th.</p></form><div id="thanks" class="hidden"><h2>Roar-some! 🦕</h2><p>Your RSVP has been received. We can’t wait to celebrate with you!</p></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
